<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ============================================================
// MODULE A: SeedEngine — Deterministic PRNG
// ============================================================

/**
 * mulberry32 — a simple seeded PRNG returning 0..1
 */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/**
 * djb2 hash — hash a word to a 32-bit unsigned integer
 */
function hashWord(w) {
  let hash = 5381;
  for (let i = 0; i < w.length; i++) {
    hash = ((hash << 5) - hash) + w.charCodeAt(i);
    hash |= 0;
  }
  return hash >>> 0;
}

/**
 * Space-themed wordlist for seed selection
 */
const SEED_WORDS = ['stellar', 'void', 'drift', 'ember', 'horizon', 'eclipse', 'nova', 'orbit', 'solar', 'cosmos', 'nebula', 'pulse', 'radiant', 'stellaris', 'umbra', 'zenith', 'aurora', 'comet', 'flare', 'gravity', 'helium', 'ignite', 'jupiter', 'kepler', 'lunar', 'mercury', 'nebula', 'orion', 'photon', 'quasar', 'rocket', 'saturn', 'thrust', 'umbriel', 'venta', 'warp', 'xenon', 'yield', 'zenith', 'astra'];

/**
 * Read seed word from URL query string (?seed=...)
 */
function getSeedFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('seed') || 'stellar';
}

// ─── Initialize SeedEngine from URL parameter ────────────────
const seedWord = getSeedFromURL();

// Multiple RNG streams — each gets a distinct seed offset
const rng = mulberry32(hashWord(seedWord));
const starRng = mulberry32(hashWord(seedWord) + 1);
const missionRng = mulberry32(hashWord(seedWord) + 2);

// Layout RNG stream — drives planet starting angles (initAngle).
// Dedicated stream so ?seed=word always yields the same orbital layout
// AND the same launch windows. NEVER use Math.random() for planet placement.
const layoutRng = mulberry32(hashWord(seedWord) + 3);

// SeedEngine namespace — provides named RNG streams for deterministic generation
const SeedEngine = {
  stream: function(seed, namespace) {
    return mulberry32(hashWord(seed + "|" + namespace));
  }
};

// ─── Seed display ────────────────────────────────────────────
// Show current seed word on the page
const seedDisplay = document.createElement('div');
seedDisplay.textContent = 'seed: ' + seedWord;
seedDisplay.style.cssText = `
  position: fixed;
  bottom: 12px;
  right: 16px;

  opacity: 0.2;

  font-family: 'Segoe UI', system-ui, sans-serif;
  transition: opacity 0.3s;
`;
seedDisplay.title = '?seed=' + seedWord + ' to change | Refresh to apply a new seed';
document.body.appendChild(seedDisplay);

// Log seed info to console
console.log('🌱 Seed: ' + seedWord + ' | RNG streams initialized');
console.log('   rng() sample: ' + rng().toFixed(6));
console.log('   starRng() sample: ' + starRng().toFixed(6));
console.log('   missionRng() sample: ' + missionRng().toFixed(6));


// ─── MODULE B: CelestialData ──────────────────────────────────────
// Planetary constants & orbital data. Used by OrbitSolver and TransferSolver.

/** Gravitational constant (km³/kg/s²) */
const G = 6.67430e-20;

/** Solar mass (kg) */
const M_SUN = 1.9885e30;

/** Earth mass (kg) */
const M_EARTH = 5.97217e24;

/** Mars mass (kg) */
const M_MARS = 6.4171e23;

/** Moon mass (kg) */
const M_MOON = 7.342e22;

/** Standard gravitational parameter — Sun (km³/s²) */
const MU_SUN = 1.32712440018e11;

/** Standard gravitational parameter — Earth (km³/s²) */
const MU_EARTH = 3.986004418e5;

/** Standard gravitational parameter — Mars (km³/s²) */
const MU_MARS = 4.282837e4;

/** Standard gravitational parameter — Moon (km³/s²) */
const MU_MOON = 4.9048695e3;

/** One Astronomical Unit in km */
const AU_TO_KM = 149597870.7;

/** One Earth year in seconds (365.25 days) */
const EARTH_PERIOD_SEC = 31557600;

/** Seconds in a day */
const SEC_PER_DAY = 86400;

/** Radians per degree */
const DEG_TO_RAD = Math.PI / 180;

// -----------------------------------------------------------
// Planet orbital data (heliocentric, circular approximation)
// Each entry: { name, a_AU, a_km, period_years, period_sec, omega, initAngle }
// -----------------------------------------------------------

// ============================================================
// PLANET_CATALOG — SINGLE SOURCE OF TRUTH
// ============================================================
// SOURCE OF TRUTH — edit here only.
//
// Physics fields:  a_AU, period_years
//   initAngle is auto-derived from the seeded layoutRng stream, so
//   ?seed=word always yields the same orbital layout AND the same
//   launch windows (never Math.random()).
// Derived fields:  a_km, period_sec, omega, initAngle,
//                  orbitRadius (scene units), period (scene seconds)
// Visual fields:   color, size, tilt, hasMoon, hasRing, tilted, retrograde, fact
//
// PLANETS (physics), PLANET_DATA (visual scene) and the runtime planets[]
// objects ALL derive from this one array.
// ============================================================

const AU_TO_SCENE = 16;      // 1 AU = 16 scene units (Earth orbitRadius)
const SCENE_YEAR_SEC = 60;   // 1 sim year = 60 sim seconds (Earth scene period)

const PLANET_CATALOG = [
  { name: "Mercury", a_AU: 0.387,  period_years: 0.241,  color: 0xb0a090, size: 0.6,  tilt: 0.03,
    fact: "Mercury is the smallest planet and orbits the Sun every 88 Earth days. A year on Mercury is just 88 days, but a day lasts 59 Earth days." },
  { name: "Venus",   a_AU: 0.723,  period_years: 0.615,  color: 0xe8c880, size: 0.9,  tilt: 2.64,
    fact: "Venus rotates backwards (retrograde) compared to most planets. It's the hottest planet at 462\u00b0C \u2014 hot enough to melt lead!" },
  { name: "Earth",   a_AU: 1.0,    period_years: 1.0,    color: 0x4499dd, size: 1.0,  tilt: 0.41, hasMoon: true,
    fact: "Earth is the only known planet with liquid water on its surface and the only one known to harbor life. About 71% is covered in water." },
  { name: "Mars",    a_AU: 1.524,  period_years: 1.881,  color: 0xcc5533, size: 0.75, tilt: 0.44,
    fact: "Mars has the tallest mountain in the solar system \u2014 Olympus Mons, at 21.9 km high. That's 2.5x the height of Everest!" },
  { name: "Jupiter", a_AU: 5.203,  period_years: 11.862, color: 0xddbb99, size: 2.4,  tilt: 0.05,
    fact: "Jupiter is the largest planet \u2014 all other planets could fit inside it. Its Great Red Spot is a storm larger than Earth that has raged for centuries." },
  { name: "Saturn",  a_AU: 9.537,  period_years: 29.457, color: 0xeeddbb, size: 2.0,  tilt: 0.47, hasRing: true,
    fact: "Saturn's ring system spans up to 282,000 km but is only about 10 meters thick. It's made of 99.9% ice and trace amounts of rock." },
  { name: "Uranus",  a_AU: 19.191, period_years: 84.011, color: 0x88ccdd, size: 1.6,  tilt: 1.71, tilted: true,
    fact: "Uranus rotates on its side with an axial tilt of 98\u00b0, likely from a massive ancient collision. It also has the coldest atmosphere at -224\u00b0C." },
  { name: "Neptune", a_AU: 30.069, period_years: 164.8,  color: 0x3366cc, size: 1.5,  tilt: 0.49,
    fact: "Neptune has the strongest winds of any planet \u2014 reaching 2,100 km/h. It was the first planet predicted mathematically before being observed." }
].map((p, i) => {
  const period_sec = p.period_years * EARTH_PERIOD_SEC;
  return {
    ...p,
    a_km: p.a_AU * AU_TO_KM,                 // derived — physics stays consistent
    period_sec,                               // derived
    omega: 2 * Math.PI / period_sec,          // derived
    initAngle: layoutRng() * Math.PI * 2,     // derived from seeded PRNG
    orbitRadius: p.a_AU * AU_TO_SCENE,        // visual derived from physics
    period: p.period_years * SCENE_YEAR_SEC,  // visual derived from physics
    index: i
  };
});

// ── Physics view — used by TransferSolver, ColonyEngine, findLaunchWindow ──
const PLANETS = PLANET_CATALOG;

// Lookup helpers
const PLANET_BY_NAME = Object.fromEntries(PLANETS.map(p => [p.name.toLowerCase(), p]));

// ── Visual view — used by the Three.js scene (orbit lines, meshes, OrbitSolver) ──
// orbitRadius & period are derived from the physics fields above, so the
// visuals can never drift from the physics.
const PLANET_DATA = PLANET_CATALOG.map(p => ({
  name: p.name, color: p.color, size: p.size,
  orbitRadius: p.orbitRadius, period: p.period, tilt: p.tilt,
  hasMoon: p.hasMoon, hasRing: p.hasRing, tilted: p.tilted, retrograde: p.retrograde,
  fact: p.fact
}));



const PARKING_ORBIT_FACTOR = 2.0;       // orbit radius = planet visual size * this
const PARKING_ORBIT_SPEED = 4.0;        // rad/sim-second (1 orbit per ~1.5 sec at 1x speed)

// ─── TimeKeeper Module ────────────────────────────────────────
const TimeKeeper = {
  simYears: 1970,
  speedMultiplier: 1.0,
  paused: false,
  scrubbing: false,
  lastWallTime: null,
  earthPeriodSec: 60,

  update(wallTimeMs) {
    if (this.lastWallTime === null) {
      this.lastWallTime = wallTimeMs;
      return;
    }
    if (this.paused || this.scrubbing) {
      this.lastWallTime = wallTimeMs;
      return;
    }
    const dtSec = (wallTimeMs - this.lastWallTime) / 1000;
    this.lastWallTime = wallTimeMs;
    // Accumulate sim years: dt * speed / earthPeriodSec
    this.simYears += (dtSec * this.speedMultiplier) / this.earthPeriodSec;
  },

  setSpeed(val) {
    // val is -100..+100
    // -100 → 0.0 (paused), 0 → 1.0 (normal), +100 → 100.0 (max)
    // Logarithmic mapping: 10^(val/50)
    if (val <= 0) {
      this.speedMultiplier = (val + 100) / 100;
    } else {
      this.speedMultiplier = Math.pow(10, val / 50);
    }
    this.paused = (this.speedMultiplier === 0);
  },

  scrubYear(val) {
    // val is 1970..2100
    this.simYears = val;
    this.scrubbing = true;
  },

  getSimYears() {
    return this.simYears;
  },

  getSimElapsedSec() {
    return this.simYears * this.earthPeriodSec;
  },

  togglePause() {
    this.paused = !this.paused;
  },

  reset() {
    this.simYears = 0;
    this.lastWallTime = null;
  }
};



// ─── MODULE D: OrbitSolver ──────────────────────────────────────
// Computes planet positions from simulation time.
// Uses planet.data for orbital parameters, planet.initAngle for starting angle.

const OrbitSolver = {
  getPlanetPosition(planet, simElapsedSec) {
    const dir = planet.data.retrograde ? -1 : 1;
    const angle = planet.initAngle + dir * (2 * Math.PI / planet.data.period) * simElapsedSec;
    return {
      x: Math.cos(angle) * planet.data.orbitRadius,
      z: Math.sin(angle) * planet.data.orbitRadius,
      angle: angle
    };
  },
  getPlanetAngle(planet, simElapsedSec) {
    const dir = planet.data.retrograde ? -1 : 1;
    return planet.initAngle + dir * (2 * Math.PI / planet.data.period) * simElapsedSec;
  }
};



// ─── MODULE E: TransferSolver — Hohmann Transfer Math Engine ──
// Dependencies: Uses constants from CelestialData (MODULE B).
// All functions are pure.
// ================================================================

// ---- HOHMANN TRANSFER ----

function computeHohmannTransfer(r1_AU, r2_AU, mu) {
  const r1_km = r1_AU * AU_TO_KM;
  const r2_km = r2_AU * AU_TO_KM;
  const outward = r2_AU > r1_AU;
  const r_peri = outward ? r1_km : r2_km;
  const r_apo  = outward ? r2_km : r1_km;
  const a_km = (r1_km + r2_km) / 2;
  const e = (r_apo - r_peri) / (r_apo + r_peri);
  const t_transfer_sec = Math.PI * Math.sqrt((a_km * a_km * a_km) / mu);

  const v_dep_circ = Math.sqrt(mu / r1_km);
  const v_dep_ellip = Math.sqrt(mu * (2 / r1_km - 1 / a_km));
  const v_arr_circ = Math.sqrt(mu / r2_km);
  const v_arr_ellip = Math.sqrt(mu * (2 / r2_km - 1 / a_km));

  const dv_depart = outward
    ? v_dep_ellip - v_dep_circ
    : v_dep_circ - v_dep_ellip;
  const dv_arrive = outward
    ? v_arr_circ - v_arr_ellip
    : v_arr_ellip - v_arr_circ;

  return {
    a_AU: a_km/AU_TO_KM, a_km, e, r_peri_km: r_peri, r_apo_km: r_apo,
    t_transfer_sec, t_transfer_days: t_transfer_sec/SEC_PER_DAY,
    t_transfer_years: t_transfer_sec/EARTH_PERIOD_SEC,
    v_dep_circ_km_s: v_dep_circ, v_dep_ellip_km_s: v_dep_ellip,
    dv_depart_km_s: dv_depart,
    v_arr_circ_km_s: v_arr_circ, v_arr_ellip_km_s: v_arr_ellip,
    dv_arrive_km_s: dv_arrive,
    dv_total_km_s: dv_depart + dv_arrive,
    is_outward: outward
  };
}

// ---- PHASE ANGLE ----

function computePhaseAngle(r1_AU, r2_AU, T1_years, T2_years, mu = MU_SUN) {
  const transfer = computeHohmannTransfer(r1_AU, r2_AU, mu);
  const t_transfer = transfer.t_transfer_sec;
  const omega1 = (2*Math.PI)/(T1_years*EARTH_PERIOD_SEC);
  const omega2 = (2*Math.PI)/(T2_years*EARTH_PERIOD_SEC);
  const phaseAngle_rad = Math.PI - omega2 * t_transfer;
  const synodicPeriod_sec = (2*Math.PI)/Math.abs(omega1 - omega2);

  return {
    phaseAngle_rad,
    phaseAngle_deg: phaseAngle_rad*180/Math.PI,
    synodicPeriod_years: synodicPeriod_sec/EARTH_PERIOD_SEC,
    synodicPeriod_days: synodicPeriod_sec/SEC_PER_DAY,
    transfer_years: transfer.t_transfer_years,
    omega1, omega2
  };
}

// ---- LAUNCH WINDOW ----

function computeLaunchWindow(currentPhaseDiff, targetPhase, omega1, omega2, synodicPeriod_years) {
  const deltaOmega = omega1 - omega2;
  let deltaPhase = currentPhaseDiff - targetPhase;
  if (deltaPhase < 0) deltaPhase += 2*Math.PI;
  deltaPhase = deltaPhase % (2*Math.PI);

  const waitTime_sec = deltaPhase / deltaOmega;
  const waitTime_years = waitTime_sec / EARTH_PERIOD_SEC;

  return {
    waitTime_years,
    waitTime_days: waitTime_years * 365.25,
    nextLaunchYear: null,
    isWindow: waitTime_years < synodicPeriod_years * 0.01
  };
}

// ---- SOI ----

function computeSOI(planetOrbitRadius_AU, planetMass_kg, starMass_kg = M_SUN) {
  const r_orbit_km = planetOrbitRadius_AU * AU_TO_KM;
  const soi_km = r_orbit_km * Math.pow(planetMass_kg/starMass_kg, 0.4);
  return { soi_km, soi_AU: soi_km/AU_TO_KM };
}

// ---- KEPLER SOLVER ----

function solveKepler(M, e, tol = 1e-12, maxIter = 50) {
  M = ((M % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  let E = e > 0.8 ? Math.PI : M + e * Math.sin(M);

  for (let i = 0; i < maxIter; i++) {
    const dE = (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < tol) return ((E % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  }
  return ((E % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
}

function trueAnomaly(E, e) {
  const factor = Math.sqrt((1+e)/(1-e));
  const nu = 2 * Math.atan2(factor * Math.sin(E/2), Math.cos(E/2));
  return ((nu % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
}

function meanAnomaly(t_sec, period_sec) {
  return (2*Math.PI * t_sec) / period_sec;
}

// ---- POSITION ON TRANSFER ELLIPSE ----

function positionOnTransferEllipse(t_elapsed_years, t_transfer_years, a_AU, e, departureAngle_rad, inward = false) {
  const t_elapsed = Math.max(0, Math.min(t_elapsed_years, t_transfer_years));
  const n = Math.PI/(t_transfer_years * EARTH_PERIOD_SEC); // Half-orbit (0→π) for Hohmann transfer
  const M = (inward ? Math.PI : 0) + n * t_elapsed * EARTH_PERIOD_SEC;
  const E = solveKepler(M, e);
  const nu = trueAnomaly(E, e);
  const r_AU = a_AU * (1 - e*Math.cos(E));

  const x_local = r_AU * Math.cos(nu);
  const y_local = r_AU * Math.sin(nu);
  const cos_t = Math.cos(departureAngle_rad + (inward ? Math.PI : 0));
  const sin_t = Math.sin(departureAngle_rad + (inward ? Math.PI : 0));

  return {
    x_AU: x_local*cos_t - y_local*sin_t,
    y_AU: x_local*sin_t + y_local*cos_t,
    r_AU,
    nu_rad: nu,
    percentComplete: t_elapsed / t_transfer_years
  };
}

// ---- VALIDATION ----

function validateTransferSolver() {
  const t = computeHohmannTransfer(1.0, 1.524, MU_SUN);
  const p = computePhaseAngle(1.0, 1.524, 1.0, 1.881, MU_SUN);

const RocketEngine = {

  generateMissions() {
    // Use seed from SeedEngine
    const seedWord = getSeedFromURL();
    const rng = mulberry32(hashWord(seedWord) + 2); // mission RNG stream
    
    this.pendingMissions = [];
    let total = 0;
    
    for (let year = 1900; year <= 2200; year++) {
      // Era-based mission count
      let maxMissions = 0;
      if (year < 1957) maxMissions = 0;      // pre-space age
      else if (year < 1970) maxMissions = 2;  // first satellites, moon
      else if (year < 2000) maxMissions = 3;  // stations, probes
      else if (year < 2100) maxMissions = 5;  // colonization begins
      else maxMissions = 8;                   // mature system
      
      const count = Math.floor(rng() * (maxMissions + 1));
      total += count;
      
      for (let i = 0; i < count; i++) {
        const mission = this.createMission(year, i, rng, seedWord);
        if (mission) this.pendingMissions.push(mission);
      }
    }
    this.missionCount = this.pendingMissions.length;
    // If ColonyEngine has generated missions, use those instead of local generation
    if (typeof ColonyEngine !== 'undefined' && ColonyEngine.timeline && ColonyEngine.timeline.missions) {
      this.pendingMissions = ColonyEngine.timeline.missions.slice().map(m => {
        // Normalize ColonyEngine missions: convert origin/destination from objects to strings
        const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
        const originName = typeof m.origin === 'object' ? capitalize(m.origin.id) : m.origin;
        const targetName = typeof m.destination === 'object' ? capitalize(m.destination.id) : (m.target || m.destination);
        return {
          ...m,
          origin: originName,
          target: targetName,
          originPlanet: originName,
          targetPlanet: targetName,

  createMission(year, index, rng, seedWord) {
    const innerPlanets = ['Earth', 'Moon'];
    const midPlanets = ['Mars', 'Venus'];
    const outerPlanets = ['Jupiter', 'Saturn'];
    
    let origins, targets;
    
    if (year < 1970) {
      origins = ['Earth'];
      targets = ['Moon'];
    } else if (year < 2000) {
      origins = ['Earth'];
      targets = ['Moon', 'Mars', 'Venus'];
    } else if (year < 2100) {
      origins = ['Earth', 'Moon', 'Mars'];
      targets = ['Moon', 'Mars', 'Venus', 'Jupiter', 'Saturn'];
    } else {
      origins = ['Earth', 'Moon', 'Mars', 'Venus'];
      targets = ['Moon', 'Mars', 'Venus', 'Jupiter', 'Saturn'];
    }

  updateRocket(rocket, simYears, simElapsedSec) {

        }
        return;
      }
      
      // Standard interplanetary mission: position on Hohmann transfer ellipse
      const pos = positionOnTransferEllipse(
        elapsed,
        rocket.transfer.t_transfer_years,
        rocket.transfer.a_AU,
        rocket.transfer.e,
        rocket.departureAngle,
        rocket.inward
      );
      
      // Update mesh position (convert AU to scene units)
      rocket.mesh.position.set(
        pos.x_AU * rocket.scale,
        0,
        pos.y_AU * rocket.scale
      );
      
      // Update trail
      rocket.trailPositions.push(new THREE.Vector3(
        pos.x_AU * rocket.scale,
        0,
        pos.y_AU * rocket.scale
      ));
      if (rocket.trailPositions.length > 50) {
        rocket.trailPositions.shift();
      }
      
      if (rocket.trailPositions.length >= 2) {
        const trailGeom = new THREE.BufferGeometry().setFromPoints(rocket.trailPositions);
        rocket.trail.geometry.dispose();
        rocket.trail.geometry = trailGeom;
      }
      
      // Check if transfer is complete
      if (elapsed >= rocket.transfer.t_transfer_years) {
        // Clean up trail
        if (rocket.trail) {
          RocketEngine.rocketGroup.remove(rocket.trail);
          rocket.trail.geometry.dispose();
          rocket.trail.material.dispose();
          rocket.trail = null;
        }
        // Clean up ghost ellipse
        if (rocket.ghostEllipse) {
          RocketEngine.rocketGroup.remove(rocket.ghostEllipse);
          rocket.ghostEllipse.geometry.dispose();
          rocket.ghostEllipse.material.dispose();
          rocket.ghostEllipse = null;
        }
        // Clear trail positions
        rocket.trailPositions = [];
        rocket.state = 'POST_ORBIT';
        rocket.orbitStartSimSec = simElapsedSec;
        
        // Pin to destination planet position
        const destPlanet = rocket.destPlanetRef || planets.find(p => p.name === rocket.target);
        if (destPlanet) {
          rocket.mesh.position.x = destPlanet.group.position.x;
          rocket.mesh.position.z = destPlanet.group.position.z;
        }
        
        // If destination has no planet ref, just land
        if (!rocket.destPlanetRef) {
          rocket.state = 'LANDED';
          rocket.mesh.material.color.setHex(0x00ff88);
          if (rocket.onComplete) rocket.onComplete(rocket);
          console.log(`🟢 ${rocket.id} LANDED on ${rocket.target} at year ${simYears.toFixed(1)}`);
        }
      }
      return;
    }
    
    // ─── POST_ORBIT: parking orbit around destination planet ───────
    if (rocket.state === 'POST_ORBIT') {
      const planet = rocket.destPlanetRef;
      if (!planet) {
        rocket.state = 'LANDED';
        return;
      }
      const orbitElapsed = simElapsedSec - rocket.orbitStartSimSec;
      const orbitAngle = orbitElapsed * PARKING_ORBIT_SPEED;
      const parkingRadius = planet.data.size * PARKING_ORBIT_FACTOR;
      const offsetX = Math.cos(orbitAngle) * parkingRadius;
      const offsetZ = Math.sin(orbitAngle) * parkingRadius;
      rocket.mesh.position.x = planet.group.position.x + offsetX;
      rocket.mesh.position.z = planet.group.position.z + offsetZ;
      
      if (orbitAngle >= 2 * Math.PI) {
        rocket.state = 'LANDED';
        rocket.mesh.material.color.setHex(0x00ff88);
        if (rocket.onComplete) rocket.onComplete(rocket);
        console.log(`🟢 ${rocket.id} LANDED on ${rocket.target} at year ${simYears.toFixed(1)}`);
      }
    }
  }
};

  isDragging: false,

  totalDragDist: 0
};

renderer.domElement.addEventListener('pointerdown', (e) => {
  camState.isDragging = true;
  camState.lastMouse.x = e.clientX;
  camState.lastMouse.y = e.clientY;
  camState.totalDragDist = 0;
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (camState.isDragging) {
    const dx = e.clientX - camState.lastMouse.x;
    const dy = e.clientY - camState.lastMouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    camState.totalDragDist += dist;
    camState.theta += dx * 0.005;
    camState.phi -= dy * 0.005;
    camState.phi = Math.max(0.05, Math.min(Math.PI - 0.05, camState.phi));
    camState.lastMouse.x = e.clientX;
    camState.lastMouse.y = e.clientY;
    updateCamera();
  }
});
renderer.domElement.addEventListener('pointerup', () => { camState.isDragging = false; });
renderer.domElement.addEventListener('pointerleave', () => { camState.isDragging = false; });
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomSpeed = 2;
  camState.radius = Math.max(5, Math.min(600, camState.radius + e.deltaY * 0.1 * zoomSpeed));
  zoomSlider.value = camState.radius;
  zoomDisplay.textContent = camState.radius.toFixed(1);
  updateCamera();
}, { passive: false });

function updateCamera() {
  if (!camState.target) return;
  const target = camState.target.position.clone().add(camState.targetOffset);
  camera.position.x = target.x + camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);
  camera.position.y = target.y + camState.radius * Math.cos(camState.phi);
  camera.position.z = target.z + camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
  camera.lookAt(target);
}

function lockToObject(obj, type, offset) {
  camState.target = obj;
  camState.targetType = type || 'object';
  camState.targetOffset.copy(offset || new THREE.Vector3(0, 0, 0));
}

function createStars() {
  const count = 8000;
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 400 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
    sizes[i] = 0.5 + Math.random() * 1.5;
    const c = 0.6 + Math.random() * 0.4;
    const tint = Math.random();
    if (tint < 0.1) { // reddish
      colors[i*3] = c; colors[i*3+1] = c*0.7; colors[i*3+2] = c*0.5;
    } else if (tint < 0.2) { // bluish
      colors[i*3] = c*0.6; colors[i*3+1] = c*0.7; colors[i*3+2] = c;
    } else {
      colors[i*3] = c; colors[i*3+1] = c; colors[i*3+2] = c;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.8,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });
  return new THREE.Points(geo, mat);
}

renderer.domElement.addEventListener('click', (event) => {
  // Ignore click if this was a drag (pointer moved more than 5px)
  if (camState.totalDragDist >= 10) return;
  
  const rect = renderer.domElement.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((event.clientX - rect.left) / rect.width) * 2 - 1,
    -((event.clientY - rect.top) / rect.height) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  
  const intersects = raycaster.intersectObjects(raycasterTargets);
  if (intersects.length > 0) {
    const hit = intersects[0].object;
    if (hit.userData && hit.userData.isClickTarget) {
      if (hit.userData.isSun) {
        // Lock to Sun
        lockToObject(sunLockTarget, 'sun');
        document.getElementById('selected-info').textContent = '☀ Sun';
        document.getElementById('selected-info').style.display = 'block';
      } else if (hit.userData.isMoon) {
        // Lock to Moon — use world-space tracking target
        const parentPlanet = planets[hit.userData.parentPlanetIndex];
        if (parentPlanet && parentPlanet.moonGroup) {
          lockToObject(moonLockTarget, 'moon');
          document.getElementById('selected-info').textContent = '🌙 Moon';
          document.getElementById('selected-info').style.display = 'block';
        }
      } else if (hit.userData.planetIndex !== undefined) {
        // Lock to planet
        lockToObject(planets[hit.userData.planetIndex].group, 'planet');
        document.getElementById('selected-info').textContent = planets[hit.userData.planetIndex].data.name;
        document.getElementById('selected-info').style.display = 'block';
      }
    }
  }
  
  // Check if we clicked a rocket
  const rocketMeshes = [];
  RocketEngine.activeRockets.forEach(r => { if (r.mesh) rocketMeshes.push(r.mesh); });
  const rocketHits = raycaster.intersectObjects(rocketMeshes);
  if (rocketHits.length > 0 && rocketHits[0].distance < (intersects.length > 0 ? intersects[0].distance : Infinity)) {
    const rocket = RocketEngine.activeRockets.find(r => r.mesh === rocketHits[0].object);
    if (rocket) {
      lockToObject(rocket.mesh, 'rocket');
      document.getElementById('selected-info').textContent = '🚀 ' + rocket.origin + '→' + rocket.target;
      document.getElementById('selected-info').style.display = 'block';
    }
  }
});

function createDust() {
  const count = 1500;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 5 + Math.random() * 60;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = (Math.random() - 0.5) * 20;
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x8888ff,
    size: 0.08,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });
  return new THREE.Points(geo, mat);
}
scene.add(createDust());

// ─── Animation loop ──────────────────────────────────────────
let startTime = performance.now();
let lastTimestamp = 0;

function animate(timestamp) {
  requestAnimationFrame(animate);
  
  // Update TimeKeeper at the START of each frame
  TimeKeeper.update(timestamp);
  
  const delta = lastTimestamp ? (timestamp - lastTimestamp) / 1000 : 0.016;
  lastTimestamp = timestamp;
  const elapsed = (timestamp - startTime) / 1000;
  
  // Sun rotation + pulse
  sunMesh.rotation.y += delta * 0.05;
  const pulse = 1 + Math.sin(elapsed * 0.3) * 0.01;
  sunMesh.scale.set(pulse, pulse, pulse);
  glowSprite.material.opacity = 0.65 + Math.sin(elapsed * 0.2) * 0.05;

  // Update planets from TimeKeeper time
  const simElapsedSec = TimeKeeper.getSimElapsedSec();
  planets.forEach(p => {
    // Use OrbitSolver to compute position from simulation time
    const pos = OrbitSolver.getPlanetPosition(p, simElapsedSec);
    const dir = p.data.retrograde ? -1 : 1;
    p.group.position.x = pos.x;
    p.group.position.z = pos.z;
    
    // Axial rotation
    p.mesh.rotation.y = (simElapsedSec / p.data.period) * Math.PI * 2 * 0.5 * dir;

    // Moon orbit
    if (p.moonGroup) {
      // Moon orbits Earth ~13 times per Earth year
      // Use TimeKeeper time so it respects pause/scrub
      const moonAngle = (simElapsedSec / p.data.period) * Math.PI * 2 * 13;
      p.moonGroup.position.x = Math.cos(moonAngle) * 3.0;
      p.moonGroup.position.z = Math.sin(moonAngle) * 3.0;
      // Update world-space lock target for camera tracking
      if (moonLockTarget) {
        moonLockTarget.position.copy(p.moonGroup.getWorldPosition(new THREE.Vector3()));
      }
    }

    // Saturn ring rotation
    if (p.data.hasRing) {
      const ring = p.group.children.find(c => c.isMesh && c.geometry.type === 'RingGeometry');
      if (ring) ring.rotation.z += delta * 0.1;
    }
  });

  updateCamera();
  
  // Update year display
  const simYears = TimeKeeper.getSimYears();
  yearDisplay.textContent = 'Year: ' + simYears.toFixed(1);
  
  // Clear rocket trails when scrubbing so old trails don't persist going backwards
  if (TimeKeeper.scrubbing) {
    // Dispose all mesh geometries and materials, remove from group
    RocketEngine.activeRockets.forEach(r => {
      if (r.mesh) { RocketEngine.rocketGroup.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); r.mesh = null; }
      if (r.trail) { RocketEngine.rocketGroup.remove(r.trail); r.trail.geometry.dispose(); r.trail.material.dispose(); r.trail = null; }
      if (r.ghostEllipse) { RocketEngine.rocketGroup.remove(r.ghostEllipse); r.ghostEllipse.geometry.dispose(); r.ghostEllipse.material.dispose(); r.ghostEllipse = null; }
    });
    // Also clean completed missions
    RocketEngine.completedMissions.forEach(r => {
      if (r.mesh) { RocketEngine.rocketGroup.remove(r.mesh); r.mesh.geometry.dispose(); r.mesh.material.dispose(); r.mesh = null; }
      if (r.trail) { RocketEngine.rocketGroup.remove(r.trail); r.trail.geometry.dispose(); r.trail.material.dispose(); r.trail = null; }
      if (r.ghostEllipse) { RocketEngine.rocketGroup.remove(r.ghostEllipse); r.ghostEllipse.geometry.dispose(); r.ghostEllipse.material.dispose(); r.ghostEllipse = null; }
    });
    // Reset all missions to pending
    const allMissions = RocketEngine.completedMissions.concat(RocketEngine.activeRockets);
    allMissions.forEach(m => {
      m.state = 'PENDING';
      m.mesh = null;
      m.trail = null;
      m.ghostEllipse = null;
      m.trailPositions = [];
      m.launchTime = null;
      m.transfer = null;
      m.originPlanetRef = null;
      m.destPlanetRef = null;
      m.parkingRadiusScene = 0;
      m.parkingRadiusAU = 0;
      m.orbitStartSimSec = 0;
    });
    RocketEngine.pendingMissions = RocketEngine.pendingMissions.concat(allMissions);
    RocketEngine.activeRockets = [];
    RocketEngine.completedMissions = [];
  }
  
  // Update RocketEngine — launch and animate rocket flights
  RocketEngine.update(simYears, simElapsedSec, planets, scene);
  
  // Camera is always locked — updateCamera() already called above
  // No need to manually follow — lockToObject handles it
  
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}



// Validate TransferSolver at startup
validateTransferSolver();
requestAnimationFrame(animate);

// ─── Resize handler ──────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});
